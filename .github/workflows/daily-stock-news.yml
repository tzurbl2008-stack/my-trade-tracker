name: Daily Stock News Alerts

on:
  # 14:15 Israel time (UTC+3 summer / UTC+2 winter)
  # Winter adjustment (Nov–Mar): change to '15 12 * * 1-5'
  schedule:
    - cron: '15 11 * * 1-5'   # 11:15 UTC = 14:15 IST (summer, UTC+3)
  workflow_dispatch:            # manual trigger for testing

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch news and send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/fetch_stock_news.py
