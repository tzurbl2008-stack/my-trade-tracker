<!DOCTYPE html>
<html lang="he" dir="rtl" data-dark="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="יומן מסחר">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>יומן מסחר</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f9;--bg2:#e2e8f0;--card:#fff;
  --text:#0f172a;--text2:#64748b;--text3:#94a3b8;
  --border:#e2e8f0;
  --primary:#2563eb;--ph:#1d4ed8;--pl:rgba(37,99,235,.1);
  --green:#16a34a;--gbg:rgba(22,163,74,.1);--gb:rgba(22,163,74,.2);
  --red:#dc2626;--rbg:rgba(220,38,38,.1);--rb:rgba(220,38,38,.2);
  --orange:#ea580c;--obg:rgba(234,88,12,.1);
  --yellow:#ca8a04;--ybg:rgba(202,138,4,.1);
  --sw:240px;--hh:56px;--bn:62px;--r:16px;
  --sh:0 1px 4px rgba(0,0,0,.06);--shm:0 4px 20px rgba(0,0,0,.1)
}
[data-dark=true]{
  --bg:#0d1117;--bg2:#161b22;--card:#1c2433;
  --text:#e6edf3;--text2:#8b949e;--text3:#484f58;
  --border:#21262d;
  --sh:0 1px 4px rgba(0,0,0,.4);--shm:0 4px 20px rgba(0,0,0,.5)
}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;direction:rtl;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}

/* ── SIDEBAR desktop ── */
#sb{width:var(--sw);background:#0a0f1e;height:100vh;position:fixed;right:0;top:0;display:flex;flex-direction:column;z-index:100;border-left:1px solid rgba(255,255,255,.04)}
[data-dark=true] #sb{background:#010409}
.sb-logo{padding:22px 16px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:12px}
.sb-ico{width:40px;height:40px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 4px 14px rgba(37,99,235,.4)}
.sb-title{color:#f1f5f9;font-size:15px;font-weight:700}
.sb-sub{color:#334155;font-size:10px;margin-top:1px}
#snav{padding:10px 8px;flex:1}
.ni{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:10px;color:#64748b;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;margin-bottom:2px;user-select:none}
.ni:hover{background:rgba(255,255,255,.06);color:#cbd5e1}
.ni.on{background:rgba(37,99,235,.18);color:#93c5fd}
.ni .ic{font-size:17px;flex-shrink:0}
.sb-acc{padding:10px 8px;border-top:1px solid rgba(255,255,255,.05)}
.sb-acc select{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 12px;color:#cbd5e1;font-size:12px;cursor:pointer;outline:none;font-family:inherit}
.sb-acc select option{background:#1e293b}

/* ── MAIN ── */
#main{margin-right:var(--sw);flex:1;display:flex;flex-direction:column;min-height:100vh}
#hdr{height:var(--hh);background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:10px;position:sticky;top:0;z-index:50;box-shadow:var(--sh)}
.hdr-title{font-size:17px;font-weight:800;flex:1;letter-spacing:-.4px}
.hdr-bal{display:flex;flex-direction:column;align-items:flex-end;background:var(--pl);padding:5px 12px;border-radius:10px;border:1px solid rgba(37,99,235,.15)}
.hdr-bal-l{font-size:10px;color:var(--primary);font-weight:700;letter-spacing:.03em}
.hdr-bal-v{font-size:15px;font-weight:800;color:var(--primary);letter-spacing:-.3px}
.ico-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s}
.ico-btn:hover{background:var(--bg2)}
#cnt{padding:18px;flex:1}

/* ── BOTTOM NAV ── */
#bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -4px 24px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom);align-items:stretch;height:calc(var(--bn) + env(safe-area-inset-bottom))}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:700;user-select:none;-webkit-tap-highlight-color:transparent;padding:6px 0;transition:color .15s}
.bni.on{color:var(--primary)}
.bni-ic{font-size:23px;line-height:1}
.bni-add{flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.bni-add-circle{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(37,99,235,.5);line-height:1;padding-bottom:3px;transition:transform .15s,box-shadow .15s}
.bni-add-circle:active{transform:scale(.9);box-shadow:0 2px 8px rgba(37,99,235,.3)}

/* ── HERO ── */
.hero{background:linear-gradient(140deg,#1e3a8a 0%,#1d4ed8 55%,#2563eb 100%);border-radius:22px;padding:24px 22px 20px;margin-bottom:14px;color:#fff;box-shadow:0 8px 32px rgba(29,78,216,.35)}
.hero-acct{font-size:12px;opacity:.65;font-weight:600;margin-bottom:10px;letter-spacing:.03em}
.hero-lbl{font-size:12px;opacity:.6;margin-bottom:4px;font-weight:500}
.hero-val{font-size:40px;font-weight:800;letter-spacing:-2px;line-height:1}
.hero-pnl{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:4px 12px;background:rgba(255,255,255,.15);border-radius:20px;font-size:13px;font-weight:700}
.hero-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:18px;background:rgba(255,255,255,.15);border-radius:14px;overflow:hidden}
.hero-cell{background:rgba(0,0,20,.15);padding:11px 0;text-align:center}
.hero-cv{font-size:17px;font-weight:800;line-height:1;letter-spacing:-.3px}
.hero-cl{font-size:10px;opacity:.6;margin-top:3px;font-weight:600}

/* ── STAT GRID ── */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.sl{font-size:10px;color:var(--text2);font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.sv{font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.ss{font-size:11px;color:var(--text3);margin-top:3px}
.sc.g .sv{color:var(--green)}.sc.r .sv{color:var(--red)}.sc.b .sv{color:var(--primary)}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.ch{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.ct{font-size:14px;font-weight:800;letter-spacing:-.3px}
.cb{padding:16px 18px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;font-family:inherit;-webkit-tap-highlight-color:transparent;letter-spacing:-.1px}
.bp{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}.bp:hover{background:var(--ph)}.bp:active{transform:scale(.97)}
.bs{background:var(--bg2);color:var(--text);border:1px solid var(--border)}.bs:hover{background:var(--border)}
.bd{background:var(--rbg);color:var(--red);border:1px solid var(--rb)}.bd:hover{background:rgba(220,38,38,.18)}
.bg2{background:var(--gbg);color:var(--green);border:1px solid var(--gb)}.bg2:hover{background:rgba(22,163,74,.2)}
.sm{padding:5px 11px;font-size:11px;border-radius:8px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}
.bg3{background:var(--gbg);color:var(--green)}
.br2{background:var(--rbg);color:var(--red)}
.bo{background:var(--obg);color:var(--orange)}
.by{background:var(--ybg);color:var(--yellow)}
.bb{background:var(--pl);color:var(--primary)}
.bgr{background:var(--bg2);color:var(--text2)}

/* ── TRADE CARD mobile ── */
.tc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.tc-head{display:flex;align-items:center;padding:13px 15px;gap:8px}
.tc-sym{font-weight:800;font-size:18px;letter-spacing:-.5px;flex:1}
.tc-pnl{font-weight:800;font-size:16px;letter-spacing:-.3px}
.tc-date{font-size:11px;color:var(--text3);padding:0 15px 9px;font-weight:500}
.tc-grid{display:grid;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.tc-grid-3{grid-template-columns:1fr 1fr 1fr}
.tc-grid-2{grid-template-columns:1fr 1fr}
.tc-cell{padding:10px 14px;background:var(--card)}
.tc-cell+.tc-cell{border-right:1px solid var(--border)}
.tc-cl{font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.tc-cv{font-size:14px;font-weight:700;letter-letters:-.2px}
.tc-actions{display:flex;gap:8px;padding:11px 14px;background:var(--bg)}
.tc-analysis{padding:14px 15px;border-top:1px solid var(--border);background:var(--bg2);font-size:12px}

/* ── TABLE desktop ── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:10px 12px;text-align:right;font-weight:700;color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:.05em;background:var(--bg2);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg2)}
tbody td{padding:11px 12px;vertical-align:middle}
.tsym{font-weight:800;font-size:13px}
.ac2{background:var(--bg2);border-radius:12px;padding:12px;margin-top:6px;font-size:12px}
.as3{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.si{padding:6px 10px;background:var(--card);border-radius:8px;margin-bottom:4px;font-size:11px;line-height:1.5}

/* ── CHART ── */
.cc{position:relative;width:100%;height:200px}
canvas{display:block}

/* ── MODAL ── */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.md{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:94vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
.md-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 2px}
.mh{padding:14px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mt2{font-size:17px;font-weight:800;letter-spacing:-.4px}
.mb2{padding:20px 22px}
.mf{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.mf .btn{flex:1;justify-content:center;padding:14px;font-size:15px}

/* ── FORM ── */
.fg{margin-bottom:16px}
.fl{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;letter-spacing:.02em}
.fi{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-size:15px;font-family:inherit;transition:border-color .15s;outline:none}
.fi:focus{border-color:var(--primary)}
.fi[type=number]{direction:ltr;text-align:right}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dt{display:flex;border:1.5px solid var(--border);border-radius:12px;overflow:hidden}
.dt button{flex:1;padding:12px 8px;border:none;background:transparent;color:var(--text2);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.dt button.al{background:var(--gbg);color:var(--green)}
.dt button.as{background:var(--rbg);color:var(--red)}
.fh{font-size:11px;color:var(--text3);margin-top:5px}

/* ── MISC ── */
.tabs{display:flex;gap:3px;background:var(--bg2);padding:3px;border-radius:12px;margin-bottom:14px}
.tab{flex:1;padding:8px 10px;border-radius:9px;border:none;background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.tab.on{background:var(--card);color:var(--text);box-shadow:var(--sh);font-weight:800}
.es{text-align:center;padding:52px 20px;color:var(--text2)}
.ei{font-size:44px;margin-bottom:12px}
.et{font-size:15px;font-weight:800;margin-bottom:5px}
.esb{font-size:13px;color:var(--text3)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cd2{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--text2);margin-top:10px}
.cr{display:flex;justify-content:space-between;padding:3px 0}
.cr strong{color:var(--text)}
.sb2{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px}
.sf{height:100%;border-radius:3px}
.ai2{display:flex;align-items:center;gap:10px;padding:13px 15px;background:var(--bg2);border-radius:12px;border:1px solid var(--border);margin-bottom:8px}
.an2{font-weight:800;font-size:13px}
.ab2{font-size:11px;color:var(--text2);margin-top:2px}
.dot{width:9px;height:9px;background:var(--green);border-radius:50%;flex-shrink:0}
select.fs{padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:12px;font-family:inherit;cursor:pointer;outline:none}
.tg{display:flex;flex-direction:column;gap:8px}
.ti{padding:12px 15px;background:var(--bg2);border-radius:12px;border-right:3px solid var(--primary);font-size:12px;line-height:1.6;font-weight:500}
.sec-lbl{font-size:11px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;padding-top:4px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.card,.sc,.tc,#hdr{transition:background .2s,border-color .2s}

/* ══════════════════════════════
   MOBILE  ≤768px
══════════════════════════════ */
@media(max-width:768px){
  #sb{display:none!important}
  .desk-only{display:none!important}
  #main{margin-right:0!important;width:100%!important}
  #bnav{display:flex!important}
  #cnt{padding:14px 14px calc(var(--bn) + env(safe-area-inset-bottom) + 8px) 14px}
  #hdr{padding:0 15px;height:52px;padding-top:env(safe-area-inset-top)}
  .sg{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .sv{font-size:20px}
  .sc{padding:12px 13px}
}

/* ══════════════════════════════
   DESKTOP  ≥769px
══════════════════════════════ */
@media(min-width:769px){
  .mob-only{display:none!important}
  #bnav{display:none!important}
  .mo{align-items:center;padding:20px}
  .md{border-radius:20px;max-width:500px}
  .md-handle{display:none}
}
</style>
</head>
<body>

<!-- SIDEBAR desktop -->
<div id="sb">
  <div class="sb-logo">
    <div class="sb-ico">📈</div>
    <div><div class="sb-title">יומן מסחר</div><div class="sb-sub">TradeTracker Pro</div></div>
  </div>
  <nav id="snav"></nav>
  <div class="sb-acc"><select id="acc-sel" onchange="switchAcc(this.value)"></select></div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="hdr"></div>
  <div id="cnt"></div>
</div>

<!-- BOTTOM NAV mobile -->
<div id="bnav"></div>

<!-- MODALS -->
<div id="mc"></div>

<script>
// ── STATE ──
let S={accounts:[],activeId:null,trades:[],dark:false,page:'dashboard',tf:'all',df:'all'};

// ── STORAGE ──
function load(){try{const d=localStorage.getItem('tt3');if(d)Object.assign(S,JSON.parse(d))}catch(e){}}
function save(){localStorage.setItem('tt3',JSON.stringify({accounts:S.accounts,activeId:S.activeId,trades:S.trades,dark:S.dark}))}

// ── UTILS ──
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().slice(0,10)}
function fn(n,d=2){return n==null?'-':Number(n).toLocaleString('he-IL',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fd(s){if(!s)return '-';return new Date(s+'T12:00:00').toLocaleDateString('he-IL')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function mob(){return window.innerWidth<=768}

// ── CALC ──
function calcPnL(dir,ep,xp,sh){return dir==='long'?(xp-ep)*sh:(ep-xp)*sh}
function calcRisk(ep,sp,sh){return Math.abs(ep-sp)*sh}
function calcRR(ep,sp,lp){
  if(!lp||!sp||!ep)return null;
  const r=Math.abs(ep-sp);return r?Math.abs(lp-ep)/r:null;
}
function rlevel(pct){
  if(pct<1)return{label:'נמוך',cls:'bg3'};
  if(pct<2)return{label:'בינוני',cls:'by'};
  if(pct<5)return{label:'גבוה',cls:'bo'};
  return{label:'גבוה מאוד',cls:'br2'};
}
function getBal(aid){
  const a=S.accounts.find(x=>x.id===aid);if(!a)return 0;
  return a.init+S.trades.filter(t=>t.aid===aid&&t.status==='closed').reduce((s,t)=>s+(t.pnl||0),0);
}
function getCurve(aid){
  const a=S.accounts.find(x=>x.id===aid);if(!a)return[];
  const closed=[...S.trades.filter(t=>t.aid===aid&&t.status==='closed')].sort((a,b)=>a.cd>b.cd?1:-1);
  const pts=[{date:a.created.slice(0,10),balance:a.init}];
  let b=a.init;
  for(const t of closed){b+=t.pnl||0;pts.push({date:t.cd,balance:b})}
  return pts;
}
function getStats(aid){
  const closed=S.trades.filter(t=>t.aid===aid&&t.status==='closed');
  const open=S.trades.filter(t=>t.aid===aid&&t.status==='open');
  const wins=closed.filter(t=>t.pnl>0);
  const losses=closed.filter(t=>t.pnl<=0);
  const tot=closed.reduce((s,t)=>s+(t.pnl||0),0);
  const wr=closed.length?(wins.length/closed.length)*100:0;
  const rrs=closed.filter(t=>t.rr);
  const avgRR=rrs.length?rrs.reduce((s,t)=>s+t.rr,0)/rrs.length:0;
  const b=getBal(aid);const a=S.accounts.find(x=>x.id===aid);
  return{closed,open,wins,losses,tot,wr,avgRR,
    best:closed.length?Math.max(...closed.map(t=>t.pnl||0)):0,
    worst:closed.length?Math.min(...closed.map(t=>t.pnl||0)):0,
    b,pct:a?(tot/a.init)*100:0};
}
function tradeScore(t){
  let s=50;const rp=t.rp||0,rv=t.rr||0;
  if(rp<1)s+=20;else if(rp<2)s+=10;else if(rp>5)s-=20;else if(rp>3)s-=10;
  if(rv>=3)s+=20;else if(rv>=2)s+=10;else if(rv>0&&rv<1)s-=20;else if(rv>0&&rv<1.5)s-=10;
  if(t.pnl>0)s+=10;else if(t.pnl<0)s-=5;
  return Math.max(0,Math.min(100,s));
}
function getSugg(t){
  const s=[];
  if(t.rp>5)s.push('⚠️ סיכון גבוה מאוד — שאוף ל-2% מקסימום לעסקה.');
  else if(t.rp>2)s.push('📊 סיכון מעל 2% — שקול להקטין פוזיציה.');
  if(t.rr&&t.rr<1)s.push('🎯 R/R מתחת ל-1 — שפר יעד או קרב סטופ.');
  if(t.pnl<0)s.push('📉 עסקה הפסדית — בדוק את ניתוח הכניסה.');
  else if(t.pnl>0)s.push('✅ עסקה רווחית — שמור את האסטרטגיה הזו.');
  if(!s.length)s.push('👍 ניהול עסקה תקין. המשך כך!');
  return s;
}
function getTips(aid){
  const closed=S.trades.filter(t=>t.aid===aid&&t.status==='closed');
  if(!closed.length)return['ברוך הבא! הוסף עסקאות לקבלת טיפים אישיים.','תמיד קבע סטופ לוס לפני כל כניסה.','אל תסכן יותר מ-2% מהתיק בעסקה אחת.','תיעוד עסקאות הוא כלי השיפור הטוב ביותר.'];
  const wr=closed.length?(closed.filter(t=>t.pnl>0).length/closed.length)*100:0;
  const ar=closed.filter(t=>t.rp).reduce((s,t)=>s+t.rp,0)/(closed.filter(t=>t.rp).length||1);
  const rrs=closed.filter(t=>t.rr);const avgR=rrs.length?rrs.reduce((s,t)=>s+t.rr,0)/rrs.length:0;
  const res=[];
  if(wr<40)res.push(`📊 אחוז הצלחה ${fn(wr,1)}% — שפר נקודות כניסה.`);
  else if(wr>65)res.push(`🏆 אחוז הצלחה מעולה ${fn(wr,1)}%! שמור על הדיסציפלינה.`);
  else res.push(`👍 אחוז הצלחה סביר ${fn(wr,1)}%. שאוף ל-50%+.`);
  if(ar>3)res.push(`⚠️ סיכון ממוצע גבוה (${fn(ar,1)}%). הורד ל-1–2%.`);
  else if(ar>0)res.push(`✅ ניהול סיכון סביר — ממוצע ${fn(ar,1)}%.`);
  if(avgR>0&&avgR<1.5)res.push(`🎯 R/R ממוצע ${fn(avgR,2)} — שאוף ל-2:1.`);
  else if(avgR>=2)res.push(`🚀 R/R ממוצע מצוין ${fn(avgR,2)}!`);
  res.push('📅 בדוק ביצועים לפי ימי שבוע.');
  res.push('🧘 אחרי הפסד — עצור 30 דקות לפני העסקה הבאה.');
  return res.slice(0,5);
}

// ── CHART ──
function drawChart(id,data){
  requestAnimationFrame(()=>{
    const cv=document.getElementById(id);if(!cv||data.length<2)return;
    const dpr=window.devicePixelRatio||1;
    const rect=cv.parentElement.getBoundingClientRect();
    cv.width=rect.width*dpr;cv.height=rect.height*dpr;
    cv.style.width=rect.width+'px';cv.style.height=rect.height+'px';
    const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    const W=rect.width,H=rect.height;
    const p={t:12,r:12,b:26,l:62};
    const pw=W-p.l-p.r,ph=H-p.t-p.b;
    const bals=data.map(d=>d.balance);
    const mn=Math.min(...bals),mx=Math.max(...bals);const rng=mx-mn||1;
    const dk=document.documentElement.dataset.dark==='true';
    const tc=dk?'#4b5e75':'#94a3b8';const gc=dk?'#161b22':'#f1f5f9';
    const up=data[data.length-1].balance>=data[0].balance;
    const lc=up?'#16a34a':'#dc2626';
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<=4;i++){
      const y=p.t+(i/4)*ph;
      ctx.strokeStyle=gc;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(p.l+pw,y);ctx.stroke();
      ctx.fillStyle=tc;ctx.font='10px system-ui';ctx.textAlign='right';
      ctx.fillText(fn(mx-(i/4)*rng,0),p.l-5,y+4);
    }
    const xs=i=>p.l+(i/(data.length-1))*pw;
    const ys=v=>p.t+ph-((v-mn)/rng)*ph;
    const gr=ctx.createLinearGradient(0,p.t,0,p.t+ph);
    gr.addColorStop(0,up?'rgba(22,163,74,.2)':'rgba(220,38,38,.2)');
    gr.addColorStop(1,up?'rgba(22,163,74,0)':'rgba(220,38,38,0)');
    ctx.beginPath();ctx.moveTo(xs(0),ys(data[0].balance));
    for(let i=1;i<data.length;i++)ctx.lineTo(xs(i),ys(data[i].balance));
    ctx.lineTo(xs(data.length-1),p.t+ph);ctx.lineTo(xs(0),p.t+ph);
    ctx.closePath();ctx.fillStyle=gr;ctx.fill();
    ctx.beginPath();ctx.moveTo(xs(0),ys(data[0].balance));
    for(let i=1;i<data.length;i++)ctx.lineTo(xs(i),ys(data[i].balance));
    ctx.strokeStyle=lc;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
    for(let i=0;i<data.length;i++){
      ctx.beginPath();ctx.arc(xs(i),ys(data[i].balance),3.5,0,Math.PI*2);
      ctx.fillStyle=lc;ctx.fill();
      ctx.strokeStyle=dk?'#1c2433':'#fff';ctx.lineWidth=2;ctx.stroke();
    }
    ctx.fillStyle=tc;ctx.font='10px system-ui';ctx.textAlign='center';
    const st=Math.max(1,Math.floor(data.length/5));
    for(let i=0;i<data.length;i+=st)ctx.fillText(data[i].date.slice(5),xs(i),H-5);
  });
}

// ── ANALYTICS ──
function renderAnalytics(){
  const closed=S.trades.filter(t=>t.aid===S.activeId&&t.status==='closed');
  const a=S.accounts.find(x=>x.id===S.activeId);const c=a?.currency||'₪';
  if(!closed.length){document.getElementById('cnt').innerHTML='<div class="es"><div class="ei">📈</div><div class="et">אין מספיק נתונים</div><div class="esb">סגור עסקאות לראות ניתוח</div></div>';return}
  const wins=closed.filter(t=>t.pnl>0);const losses=closed.filter(t=>t.pnl<=0);
  const tot=closed.reduce((s,t)=>s+(t.pnl||0),0);
  const aw=wins.length?wins.reduce((s,t)=>s+(t.pnl||0),0)/wins.length:0;
  const al=losses.length?losses.reduce((s,t)=>s+(t.pnl||0),0)/losses.length:0;
  const ar=closed.filter(t=>t.rp).reduce((s,t)=>s+t.rp,0)/(closed.filter(t=>t.rp).length||1);
  const wt=Math.abs(losses.reduce((s,t)=>s+(t.pnl||0),0));
  const pf=wt>0?Math.abs(wins.reduce((s,t)=>s+(t.pnl||0),0))/wt:wins.length?99:0;
  const cv=getCurve(S.activeId);
  const monthly={};
  closed.forEach(t=>{const m=(t.cd||'').slice(0,7);if(!m)return;if(!monthly[m])monthly[m]={pnl:0,cnt:0};monthly[m].pnl+=t.pnl||0;monthly[m].cnt++});
  const rrs=closed.filter(t=>t.rr);const avgRR=rrs.length?rrs.reduce((s,t)=>s+t.rr,0)/rrs.length:0;
  document.getElementById('cnt').innerHTML=`
    <div class="sg" style="margin-bottom:14px">
      <div class="sc"><div class="sl">פקטור רווח</div><div class="sv" style="color:${pf>=1?'var(--green)':'var(--red)'}">${isFinite(pf)&&pf<99?fn(pf,2):'∞'}</div></div>
      <div class="sc g"><div class="sl">ממוצע ניצחון</div><div class="sv">${c} ${fn(aw)}</div></div>
      <div class="sc r"><div class="sl">ממוצע הפסד</div><div class="sv">${c} ${fn(Math.abs(al))}</div></div>
      <div class="sc"><div class="sl">סיכון ממוצע</div><div class="sv">${fn(ar,2)}%</div></div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="ch"><span class="ct">📈 עקומת הון</span></div>
      <div class="cb" style="padding:14px"><div class="cc"><canvas id="ch2"></canvas></div></div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="ch"><span class="ct">📊 פירוט</span></div>
      <div class="cb">
        ${[['עסקאות מנצחות',`${wins.length} (${fn((wins.length/closed.length)*100,1)}%)`],['עסקאות מפסידות',`${losses.length} (${fn((losses.length/closed.length)*100,1)}%)`],
           ['רווח כולל',`${c} ${fn(tot)}`],['עסקה טובה ביותר',`+${c} ${fn(Math.max(...closed.map(t=>t.pnl||0)))}`],
           ['עסקה גרועה ביותר',`${c} ${fn(Math.min(...closed.map(t=>t.pnl||0)))}`],['R/R ממוצע',avgRR?fn(avgRR,2):'—']
        ].map(([l,v])=>`<div style="display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--border)"><span style="color:var(--text2)">${l}</span><span style="font-weight:700">${v}</span></div>`).join('')}
      </div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="ch"><span class="ct">📅 חודשי</span></div>
      <div class="cb"><div style="display:flex;gap:8px;flex-wrap:wrap">
        ${Object.entries(monthly).sort().map(([m,d])=>`
          <div style="background:${d.pnl>=0?'var(--gbg)':'var(--rbg)'};border-radius:12px;padding:12px 14px;min-width:100px;text-align:center;border:1px solid ${d.pnl>=0?'var(--gb)':'var(--rb)'}">
            <div style="font-size:10px;color:var(--text2);font-weight:700;margin-bottom:3px">${m}</div>
            <div style="font-weight:800;font-size:15px;color:${d.pnl>=0?'var(--green)':'var(--red)'}">${d.pnl>=0?'+':''}${c} ${fn(d.pnl)}</div>
            <div style="font-size:10px;color:var(--text2);margin-top:2px">${d.cnt} עסקאות</div>
          </div>`).join('')}
      </div></div>
    </div>
    <div class="card">
      <div class="ch"><span class="ct">💡 המלצות</span></div>
      <div class="cb" style="padding:12px 14px"><div class="tg">${getTips(S.activeId).map(t=>`<div class="ti">${esc(t)}</div>`).join('')}</div></div>
    </div>`;
  if(cv.length>=2)drawChart('ch2',cv);
}

function setDir(d){
  document.getElementById('fd3').value=d;
  document.getElementById('bl2').className=d==='long'?'al':'';
  document.getElementById('bs3').className=d==='short'?'as':'';
  calcPrev();
}
function calcPrev(){
  const e=+document.getElementById('fe2')?.value||0;
  const s=+document.getElementById('fst2')?.value||0;
  const l=+document.getElementById('fl3')?.value||0;
  const sh=+document.getElementById('fsh2')?.value||0;
  const a=S.accounts.find(x=>x.id===S.activeId);const c=a?.currency||'₪';
  if(e&&sh){const inv=document.getElementById('finv2');if(inv)inv.value=(e*sh).toFixed(2)}
  const prev=document.getElementById('cprev3');if(!prev)return;
  if(e&&s&&sh){
    const b=getBal(S.activeId);
    const ra=calcRisk(e,s,sh);const rp=b>0?(ra/b)*100:0;
    const rv=l?calcRR(e,s,l):null;const rl=rlevel(rp);
    prev.innerHTML=`<div class="cd2">
      <div class="cr"><span>סיכון בעסקה:</span><strong style="color:var(--red)">${c} ${fn(ra)}</strong></div>
      <div class="cr"><span>סיכון מחשבון:</span><strong><span class="badge ${rl.cls}">${fn(rp,2)}% — ${rl.label}</span></strong></div>
      ${rv?`<div class="cr"><span>יחס R/R:</span><strong style="color:${rv>=2?'var(--green)':rv<1?'var(--red)':'var(--yellow)'}">${fn(rv,2)}</strong></div>`:''}</div>`;
  }else prev.innerHTML='';
}
function submitAdd(){
  const sym=(document.getElementById('fs2')?.value||'').trim().toUpperCase();
  const d=document.getElementById('fd3')?.value||'long';
  const e=+document.getElementById('fe2')?.value||0;
  const s=+document.getElementById('fst2')?.value||0;
  const l=+document.getElementById('fl3')?.value||0;
  const sh=+document.getElementById('fsh2')?.value||0;
  const inv=+document.getElementById('finv2')?.value||e*sh;
  const dt=document.getElementById('fdt2')?.value||today();
  const nt=(document.getElementById('fnt2')?.value||'').trim();
  if(!sym){alert('נא להזין סמל');return}
  if(!e||e<=0){alert('נא להזין מחיר כניסה');return}
  if(!s||s<=0){alert('נא להזין סטופ לוס');return}
  if(!sh||sh<=0){alert('נא להזין כמות');return}
  const b=getBal(S.activeId);
  const ra=calcRisk(e,s,sh);const rp=b>0?(ra/b)*100:0;const rv=l?calcRR(e,s,l):null;
  S.trades.push({id:uid(),aid:S.activeId,symbol:sym,dir:d,ep:e,sp:s,lp:l||null,shares:sh,inv,status:'open',od:dt,ra,rp,rr:rv,notes:nt});
  save();closeM();render();
}

function prevClose(id){
  const t=S.trades.find(x=>x.id===id);if(!t)return;
  const ex=+document.getElementById('cx2')?.value||0;
  const a=S.accounts.find(x=>x.id===S.activeId);const c=a?.currency||'₪';
  if(!ex){document.getElementById('cprev4').innerHTML='';return}
  const p=calcPnL(t.dir,t.ep,ex,t.shares);
  const pp=(p/t.inv)*100;const col=p>=0?'var(--green)':'var(--red)';
  document.getElementById('cprev4').innerHTML=`
    <div class="cd2" style="border:1.5px solid ${col};background:${p>=0?'var(--gbg)':'var(--rbg)'};margin-bottom:16px">
      <div class="cr"><span>רווח/הפסד:</span><strong style="color:${col};font-size:20px">${p>=0?'+':''}${c} ${fn(p)}</strong></div>
      <div class="cr"><span>תשואה:</span><strong style="color:${col}">${pp>=0?'+':''}${fn(pp,2)}%</strong></div>
    </div>`;
}
function submitClose(id){
  const ex=+document.getElementById('cx2')?.value||0;
  const cd=document.getElementById('cdt2')?.value||today();
  if(!ex||ex<=0){alert('נא להזין מחיר יציאה');return}
  const t=S.trades.find(x=>x.id===id);if(!t)return;
  const p=calcPnL(t.dir,t.ep,ex,t.shares);const pp=(p/t.inv)*100;
  Object.assign(t,{status:'closed',xp:ex,cd,pnl:p,pp});
  save();closeM();render();
}
function delTrade(id){
  if(!confirm('למחוק עסקה זו?'))return;
  S.trades=S.trades.filter(t=>t.id!==id);save();render();
}

}
function delAcc(id){
  if(S.accounts.length===1){alert('לא ניתן למחוק את החשבון האחרון');return}
  if(!confirm('מחיקת חשבון תמחק גם את כל עסקאותיו. להמשיך?'))return;
  S.accounts=S.accounts.filter(a=>a.id!==id);
  S.trades=S.trades.filter(t=>t.aid!==id);
  if(S.activeId===id)S.activeId=S.accounts[0]?.id||null;
  save();render();
}
function closeM(){document.getElementById('mc').innerHTML=''}

// ── ROUTING ──
function go(p){S.page=p;render()}
function switchAcc(id){S.activeId=id;save();render()}
function toggleDark(){S.dark=!S.dark;document.documentElement.dataset.dark=S.dark;save();render()}

// ── RENDER ──
function render(){
  document.documentElement.dataset.dark=S.dark;
  renderSB();renderBNav();renderHDR();
  if(S.page==='dashboard')renderDash();
  else if(S.page==='trades')renderTrades();
  else if(S.page==='analytics')renderAnalytics();
  else if(S.page==='settings')renderSettings();
}

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));

load();render();
window.addEventListener('resize',()=>{
  render();
  const cv=getCurve(S.activeId);
  if(cv.length>=2){
    if(S.page==='dashboard')drawChart('ch1',cv);
    if(S.page==='analytics')drawChart('ch2',cv);
  }
});
</script>
</body>
</html>
