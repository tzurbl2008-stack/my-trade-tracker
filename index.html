<!DOCTYPE html>
<html lang="he" dir="rtl" data-dark="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יומן מסחר</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--bg2:#f1f5f9;--card:#fff;
  --text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --border:#e2e8f0;--primary:#3b82f6;--primary-h:#2563eb;
  --green:#22c55e;--gbg:rgba(34,197,94,.12);
  --red:#ef4444;--rbg:rgba(239,68,68,.12);
  --orange:#f97316;--obg:rgba(249,115,22,.12);
  --yellow:#eab308;--ybg:rgba(234,179,8,.12);
  --sw:220px;--hh:64px;--r:12px;
  --sh:0 1px 3px rgba(0,0,0,.08);--shm:0 4px 12px rgba(0,0,0,.1)
}
[data-dark=true]{
  --bg:#0f172a;--bg2:#1e293b;--card:#1e293b;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#475569;
  --border:#334155;--sh:0 1px 3px rgba(0,0,0,.3);--shm:0 4px 12px rgba(0,0,0,.4)
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;direction:rtl;transition:background .2s,color .2s}
#sb{width:var(--sw);background:#0f172a;height:100vh;position:fixed;right:0;top:0;display:flex;flex-direction:column;z-index:100}
[data-dark=true] #sb{background:#020617;border-left:1px solid #1e293b}
.sb-logo{padding:18px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.sb-icon{width:36px;height:36px;background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sb-title{color:#f1f5f9;font-size:15px;font-weight:700}
.sb-sub{color:#64748b;font-size:10px}
#snav{padding:10px 8px;flex:1}
.ni{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;color:#94a3b8;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;margin-bottom:2px;user-select:none}
.ni:hover{background:rgba(255,255,255,.06);color:#e2e8f0}
.ni.on{background:rgba(59,130,246,.15);color:#60a5fa}
.ni .ic{font-size:15px;flex-shrink:0}
.sb-acc{padding:10px 8px;border-top:1px solid rgba(255,255,255,.08)}
.sb-acc select{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 10px;color:#e2e8f0;font-size:12px;cursor:pointer;outline:none;font-family:inherit}
.sb-acc select option{background:#1e293b}
#main{margin-right:var(--sw);flex:1;display:flex;flex-direction:column;min-height:100vh}
#hdr{height:var(--hh);background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px;position:sticky;top:0;z-index:50;box-shadow:var(--sh)}
.hdr-title{font-size:17px;font-weight:700;flex:1}
.hdr-bal{display:flex;flex-direction:column;align-items:center;background:var(--bg2);padding:5px 14px;border-radius:8px;border:1px solid var(--border)}
.hdr-bal-lbl{font-size:10px;color:var(--text2);font-weight:500}
.hdr-bal-val{font-size:15px;font-weight:700;color:var(--primary)}
.bic{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s}
.bic:hover{background:var(--bg2);color:var(--text)}
#cnt{padding:22px;flex:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.ch{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.ct{font-size:14px;font-weight:600}
.cb{padding:18px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;box-shadow:var(--sh)}
.sl{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:5px}
.sv{font-size:22px;font-weight:700;line-height:1.2}
.ss{font-size:11px;color:var(--text3);margin-top:3px}
.sc.g .sv{color:var(--green)}.sc.r .sv{color:var(--red)}.sc.b .sv{color:var(--primary)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
.bp{background:var(--primary);color:#fff}.bp:hover{background:var(--primary-h)}
.bs{background:var(--bg2);color:var(--text);border:1px solid var(--border)}.bs:hover{background:var(--border)}
.bd{background:var(--rbg);color:var(--red);border:1px solid rgba(239,68,68,.2)}.bd:hover{background:rgba(239,68,68,.22)}
.bg2{background:var(--gbg);color:var(--green);border:1px solid rgba(34,197,94,.2)}.bg2:hover{background:rgba(34,197,94,.22)}
.sm{padding:4px 9px;font-size:11px}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600}
.bg3{background:var(--gbg);color:var(--green)}
.br{background:var(--rbg);color:var(--red)}
.bo{background:var(--obg);color:var(--orange)}
.by{background:var(--ybg);color:var(--yellow)}
.bb{background:rgba(59,130,246,.1);color:var(--primary)}
.bgr{background:var(--bg2);color:var(--text2)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:9px 10px;text-align:right;font-weight:600;color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:.05em;background:var(--bg2);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg2)}
tbody td{padding:10px;vertical-align:middle}
.tsym{font-weight:700;font-size:13px}
.cc{position:relative;width:100%;height:220px;margin-top:4px}
canvas{display:block}
.fg{margin-bottom:14px}
.fl{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px}
.fi{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit;transition:border-color .15s;outline:none}
.fi:focus{border-color:var(--primary)}
.fi[type=number]{direction:ltr;text-align:right}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dt{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.dt button{flex:1;padding:8px;border:none;background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.dt button.al{background:var(--gbg);color:var(--green)}
.dt button.as{background:var(--rbg);color:var(--red)}
.fh{font-size:10px;color:var(--text3);margin-top:3px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.md{background:var(--card);border-radius:16px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mh{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mt2{font-size:17px;font-weight:700}
.mb2{padding:20px 22px}
.mf{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px}
.ac2{background:var(--bg2);border-radius:10px;padding:12px;margin-top:8px;font-size:12px}
.ar{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)}
.ar:last-of-type{border-bottom:none}
.al2{color:var(--text2)}.av{font-weight:600}
.as3{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.si{padding:5px 8px;background:var(--card);border-radius:6px;margin-bottom:3px;font-size:11px;line-height:1.5}
.tg{display:flex;flex-direction:column;gap:8px}
.ti{padding:10px 14px;background:var(--bg2);border-radius:10px;border-right:3px solid var(--primary);font-size:12px;line-height:1.5}
.tabs{display:flex;gap:3px;background:var(--bg2);padding:3px;border-radius:10px;margin-bottom:14px}
.tab{flex:1;padding:6px 10px;border-radius:7px;border:none;background:transparent;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.tab.on{background:var(--card);color:var(--text);box-shadow:var(--sh);font-weight:600}
.es{text-align:center;padding:50px 20px;color:var(--text2)}
.ei{font-size:40px;margin-bottom:10px}
.et{font-size:14px;font-weight:600;margin-bottom:5px}
.esb{font-size:12px;color:var(--text3)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cd2{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:11px;color:var(--text2);margin-top:10px}
.cr{display:flex;justify-content:space-between;padding:2px 0}
.cr strong{color:var(--text)}
.sb2{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:3px}
.sf{height:100%;border-radius:3px}
.ai2{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg2);border-radius:10px;border:1px solid var(--border);margin-bottom:8px}
.an2{font-weight:600;font-size:13px}
.ab2{font-size:11px;color:var(--text2);margin-top:2px}
.dot{width:8px;height:8px;background:var(--green);border-radius:50%}
select.fs{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:12px;font-family:inherit;cursor:pointer;outline:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.card,.sc,#hdr,#sb{transition:background .2s,border-color .2s}
@media(max-width:768px){:root{--sw:0px}.sg{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="sb">
  <div class="sb-logo">
    <div class="sb-icon">📈</div>
    <div><div class="sb-title">יומן מסחר</div><div class="sb-sub">TradeTracker Pro</div></div>
  </div>
  <nav id="snav"></nav>
  <div class="sb-acc"><select id="acc-sel" onchange="switchAcc(this.value)"></select></div>
</div>
<div id="main">
  <div id="hdr"></div>
  <div id="cnt"></div>
</div>
<div id="mc"></div>
<script>
// STATE
let S={accounts:[],activeId:null,trades:[],dark:false,page:'dashboard',tf:'all',df:'all'};

// STORAGE
function load(){
  try{const d=localStorage.getItem('tt3');if(d)Object.assign(S,JSON.parse(d))}catch(e){}
  if(!S.accounts.length)initSample();
}
function save(){
  localStorage.setItem('tt3',JSON.stringify({accounts:S.accounts,activeId:S.activeId,trades:S.trades,dark:S.dark}));
}

// UTILS
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().slice(0,10)}
function fn(n,d=2){return n==null?'-':Number(n).toLocaleString('he-IL',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fd(s){if(!s)return '-';return new Date(s+'T12:00:00').toLocaleDateString('he-IL')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// CALCULATIONS
function calcPnL(dir,entry,exit,shares){return dir==='long'?(exit-entry)*shares:(entry-exit)*shares}
function calcRisk(entry,stop,shares){return Math.abs(entry-stop)*shares}
function calcRR(entry,stop,limit){
  if(!limit||!stop||!entry)return null;
  const r=Math.abs(entry-stop);
  return r?Math.abs(limit-entry)/r:null;
}
function rlevel(pct){
  if(pct<1)return{label:'נמוך',cls:'bg3'};
  if(pct<2)return{label:'בינוני',cls:'by'};
  if(pct<5)return{label:'גבוה',cls:'bo'};
  return{label:'גבוה מאוד',cls:'br'};
}
function getBal(aid){
  const a=S.accounts.find(x=>x.id===aid);
  if(!a)return 0;
  return a.init+S.trades.filter(t=>t.aid===aid&&t.status==='closed').reduce((s,t)=>s+(t.pnl||0),0);
}
function getCurve(aid){
  const a=S.accounts.find(x=>x.id===aid);if(!a)return[];
  const closed=[...S.trades.filter(t=>t.aid===aid&&t.status==='closed')].sort((a,b)=>a.cd>b.cd?1:-1);
  const pts=[{date:a.created.slice(0,10),balance:a.init}];
  let b=a.init;
  for(const t of closed){b+=t.pnl||0;pts.push({date:t.cd,balance:b})}
  return pts;
}
function getStats(aid){
  const closed=S.trades.filter(t=>t.aid===aid&&t.status==='closed');
  const open=S.trades.filter(t=>t.aid===aid&&t.status==='open');
  const wins=closed.filter(t=>t.pnl>0);
  const losses=closed.filter(t=>t.pnl<=0);
  const tot=closed.reduce((s,t)=>s+(t.pnl||0),0);
  const wr=closed.length?(wins.length/closed.length)*100:0;
  const rrs=closed.filter(t=>t.rr);
  const avgRR=rrs.length?rrs.reduce((s,t)=>s+t.rr,0)/rrs.length:0;
  const b=getBal(aid);const a=S.accounts.find(x=>x.id===aid);
  return{closed,open,wins,losses,tot,wr,avgRR,
    best:closed.length?Math.max(...closed.map(t=>t.pnl||0)):0,
    worst:closed.length?Math.min(...closed.map(t=>t.pnl||0)):0,
    b,pct:a?(tot/a.init)*100:0};
}
function tradeScore(t){
  let s=50;const rp=t.rp||0,rv=t.rr||0;
  if(rp<1)s+=20;else if(rp<2)s+=10;else if(rp>5)s-=20;else if(rp>3)s-=10;
  if(rv>=3)s+=20;else if(rv>=2)s+=10;else if(rv>0&&rv<1)s-=20;else if(rv>0&&rv<1.5)s-=10;
  if(t.pnl>0)s+=10;else if(t.pnl<0)s-=5;
  return Math.max(0,Math.min(100,s));
}
function getSugg(t){
  const s=[];
  if(t.rp>5)s.push('⚠️ סיכון גבוה מאוד — שאוף לסיכון מקסימלי של 2% לעסקה.');
  else if(t.rp>2)s.push('📊 שקול להקטין גודל פוזיציה — סיכון מעל 2%.');
  if(t.rr&&t.rr<1)s.push('🎯 R/R מתחת ל-1 — שפר יעד רווח או קרב סטופ לוס.');
  if(t.pnl<0)s.push('📉 עסקה הפסדית — בדוק אם ניתוח הכניסה היה תקין.');
  else if(t.pnl>0)s.push('✅ עסקה רווחית — שמור את האסטרטגיה שעבדה כאן.');
  if(!s.length)s.push('👍 ניהול עסקה תקין. המשך כך!');
  return s;
}
function getTips(aid){
  const closed=S.trades.filter(t=>t.aid===aid&&t.status==='closed');
  if(!closed.length)return[
    'ברוך הבא! הוסף עסקאות כדי לקבל טיפים אישיים.',
    'תמיד קבע סטופ לוס לפני כניסה לכל עסקה.',
    'אל תסכן יותר מ-2% מהתיק בעסקה אחת.',
    'תעד כל עסקה — יומן מסחר הוא כלי השיפור הטוב ביותר.'
  ];
  const wr=closed.length?(closed.filter(t=>t.pnl>0).length/closed.length)*100:0;
  const ar=closed.filter(t=>t.rp).reduce((s,t)=>s+t.rp,0)/(closed.filter(t=>t.rp).length||1);
  const rrs=closed.filter(t=>t.rr);const avgR=rrs.length?rrs.reduce((s,t)=>s+t.rr,0)/rrs.length:0;
  const res=[];
  if(wr<40)res.push(`📊 אחוז הצלחה ${fn(wr,1)}% — שפר נקודות כניסה וחכה לסטאפ ברור.`);
  else if(wr>65)res.push(`🏆 אחוז הצלחה מעולה ${fn(wr,1)}%! שמור על הדיסציפלינה.`);
  else res.push(`👍 אחוז הצלחה סביר ${fn(wr,1)}%. שאוף ל-50%+ עם R/R גבוה.`);
  if(ar>3)res.push(`⚠️ סיכון ממוצע גבוה (${fn(ar,1)}%). הורד ל-1-2% לעסקה.`);
  else if(ar>0)res.push(`✅ ניהול סיכון סביר — ממוצע ${fn(ar,1)}%. שמור על זה.`);
  if(avgR>0&&avgR<1.5)res.push(`🎯 R/R ממוצע ${fn(avgR,2)} — שאוף ל-2:1. חפש יעדים רחוקים יותר.`);
  else if(avgR>=2)res.push(`🚀 R/R ממוצע מצוין ${fn(avgR,2)}! המספרים בצדך.`);
  res.push('📅 בדוק ביצועים לפי ימי שבוע — ייתכן שיש ימים עדיפים.');
  res.push('🧘 שמור על קור רוח. אחרי הפסד, עצור לפחות 30 דקות.');
  return res.slice(0,5);
}

// SAMPLE DATA
function initSample(){
  const aid=uid();
  const ago=d=>new Date(Date.now()-d*864e5).toISOString();
  S.accounts=[{id:aid,name:'תיק ראשי',init:50000,currency:'₪',created:ago(90)}];
  S.activeId=aid;
  const raw=[
    {sym:'AAPL',dir:'long',e:182,s:177,l:192,sh:15,ex:190,do:55,dc:50},
    {sym:'MSFT',dir:'long',e:410,s:400,l:430,sh:5,ex:425,do:45,dc:40},
    {sym:'TSLA',dir:'short',e:195,s:205,l:175,sh:10,ex:188,do:35,dc:30},
    {sym:'NVDA',dir:'long',e:850,s:820,l:910,sh:3,ex:835,do:25,dc:20},
    {sym:'META',dir:'long',e:515,s:500,l:545,sh:4,ex:538,do:15,dc:10},
    {sym:'AMZN',dir:'long',e:185,s:180,l:200,sh:12,ex:193,do:8,dc:3},
  ];
  S.trades=raw.map(r=>{
    const p=calcPnL(r.dir,r.e,r.ex,r.sh);
    const ra=calcRisk(r.e,r.s,r.sh);
    const rv=calcRR(r.e,r.s,r.l);
    return{id:uid(),aid,symbol:r.sym,dir:r.dir,ep:r.e,sp:r.s,lp:r.l,shares:r.sh,
      inv:r.e*r.sh,status:'closed',od:ago(r.do).slice(0,10),cd:ago(r.dc).slice(0,10),
      xp:r.ex,pnl:p,pp:(p/(r.e*r.sh))*100,ra,rp:(ra/50000)*100,rr:rv,notes:''};
  });
  S.trades.push({id:uid(),aid,symbol:'GOOG',dir:'long',ep:175,sp:168,lp:190,
    shares:8,inv:1400,status:'open',od:today(),notes:''});
  save();
}

// CHART
function drawChart(id,data){
  requestAnimationFrame(()=>{
    const cv=document.getElementById(id);if(!cv||data.length<2)return;
    const dpr=window.devicePixelRatio||1;
    const rect=cv.parentElement.getBoundingClientRect();
    cv.width=rect.width*dpr;cv.height=rect.height*dpr;
    cv.style.width=rect.width+'px';cv.style.height=rect.height+'px';
    const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    const W=rect.width,H=rect.height;
    const p={t:16,r:16,b:32,l:68};
    const pw=W-p.l-p.r,ph=H-p.t-p.b;
    const bals=data.map(d=>d.balance);
    const mn=Math.min(...bals),mx=Math.max(...bals);const rng=mx-mn||1;
    const dk=document.documentElement.dataset.dark==='true';
    const tc=dk?'#64748b':'#94a3b8';const gc=dk?'#1e293b':'#f1f5f9';
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<=4;i++){
      const y=p.t+(i/4)*ph;
      ctx.strokeStyle=gc;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(p.l+pw,y);ctx.stroke();
      ctx.fillStyle=tc;ctx.font='10px system-ui';ctx.textAlign='right';
      ctx.fillText(fn(mx-(i/4)*rng,0),p.l-5,y+4);
    }
    const xs=i=>p.l+(i/(data.length-1))*pw;
    const ys=v=>p.t+ph-((v-mn)/rng)*ph;
    const gr=ctx.createLinearGradient(0,p.t,0,p.t+ph);
    gr.addColorStop(0,'rgba(59,130,246,.22)');gr.addColorStop(1,'rgba(59,130,246,0)');
    ctx.beginPath();ctx.moveTo(xs(0),ys(data[0].balance));
    for(let i=1;i<data.length;i++)ctx.lineTo(xs(i),ys(data[i].balance));
    ctx.lineTo(xs(data.length-1),p.t+ph);ctx.lineTo(xs(0),p.t+ph);
    ctx.closePath();ctx.fillStyle=gr;ctx.fill();
    ctx.beginPath();ctx.moveTo(xs(0),ys(data[0].balance));
    for(let i=1;i<data.length;i++)ctx.lineTo(xs(i),ys(data[i].balance));
    ctx.strokeStyle='#3b82f6';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
    for(let i=0;i<data.length;i++){
      ctx.beginPath();ctx.arc(xs(i),ys(data[i].balance),4,0,Math.PI*2);
      ctx.fillStyle='#3b82f6';ctx.fill();
      ctx.strokeStyle=dk?'#1e293b':'#fff';ctx.lineWidth=2;ctx.stroke();
    }
    ctx.fillStyle=tc;ctx.font='10px system-ui';ctx.textAlign='center';
    const st=Math.max(1,Math.floor(data.length/5));
    for(let i=0;i<data.length;i+=st)ctx.fillText(data[i].date.slice(5),xs(i),H-8);
  });
}

  const wins=closed.filter(t=>t.pnl>0);const losses=closed.filter(t=>t.pnl<=0);
  const tot=closed.reduce((s,t)=>s+(t.pnl||0),0);
  const aw=wins.length?wins.reduce((s,t)=>s+(t.pnl||0),0)/wins.length:0;
  const al=losses.length?losses.reduce((s,t)=>s+(t.pnl||0),0)/losses.length:0;
  const ar=closed.filter(t=>t.rp).reduce((s,t)=>s+t.rp,0)/(closed.filter(t=>t.rp).length||1);
  const wt=Math.abs(losses.reduce((s,t)=>s+(t.pnl||0),0));
  const pf=wt>0?Math.abs(wins.reduce((s,t)=>s+(t.pnl||0),0))/wt:wins.length?99:0;

  const rrs=closed.filter(t=>t.rr);const avgRR=rrs.length?rrs.reduce((s,t)=>s+t.rr,0)/rrs.length:0;

      <div class="sc"><div class="sl">סיכון ממוצע לעסקה</div><div class="sv">${fn(ar,2)}%</div></div>
    </div>

        <div class="cb" style="padding:10px">

             ['מפסידות',`${losses.length} (${fn((losses.length/closed.length)*100,1)}%)`],
             ['רווח כולל',`${c} ${fn(tot)}`],
             ['עסקה טובה',`+${c} ${fn(Math.max(...closed.map(t=>t.pnl||0)))}`],
             ['עסקה גרועה',`${c} ${fn(Math.min(...closed.map(t=>t.pnl||0)))}`],

        <div class="mf">
          <button class="btn bp" onclick="submitAdd()">הוסף עסקה</button>
          <button class="btn bs" onclick="closeM()">ביטול</button>
        </div>
      </div>
    </div>`;
}

function setDir(d){
  document.getElementById('fd3').value=d;
  document.getElementById('bl2').className=d==='long'?'al':'';
  document.getElementById('bs3').className=d==='short'?'as':'';
  calcPrev();
}

function calcPrev(){
  const e=+document.getElementById('fe2')?.value||0;
  const s=+document.getElementById('fst2')?.value||0;
  const l=+document.getElementById('fl3')?.value||0;
  const sh=+document.getElementById('fsh2')?.value||0;
  const a=S.accounts.find(x=>x.id===S.activeId);const c=a?.currency||'₪';
  if(e&&sh){const inv=document.getElementById('finv2');if(inv)inv.value=(e*sh).toFixed(2)}
  const prev=document.getElementById('cprev3');if(!prev)return;
  if(e&&s&&sh){
    const b=getBal(S.activeId);
    const ra=calcRisk(e,s,sh);const rp=b>0?(ra/b)*100:0;
    const rv=l?calcRR(e,s,l):null;const rl=rlevel(rp);
    prev.innerHTML=`<div class="cd2">
      <div class="cr"><span>סיכון בעסקה:</span><strong style="color:var(--red)">${c} ${fn(ra)}</strong></div>
      <div class="cr"><span>סיכון מחשבון:</span><strong><span class="badge ${rl.cls}">${fn(rp,2)}% — ${rl.label}</span></strong></div>
      ${rv?`<div class="cr"><span>יחס R/R:</span><strong style="color:${rv>=2?'var(--green)':rv<1?'var(--red)':'var(--yellow)'}">${fn(rv,2)}</strong></div>`:''}</div>`;
  }else prev.innerHTML='';
}

function submitAdd(){
  const sym=(document.getElementById('fs2')?.value||'').trim().toUpperCase();
  const d=document.getElementById('fd3')?.value||'long';
  const e=+document.getElementById('fe2')?.value||0;
  const s=+document.getElementById('fst2')?.value||0;
  const l=+document.getElementById('fl3')?.value||0;
  const sh=+document.getElementById('fsh2')?.value||0;
  const inv=+document.getElementById('finv2')?.value||e*sh;
  const dt=document.getElementById('fdt2')?.value||today();
  const nt=(document.getElementById('fnt2')?.value||'').trim();
  if(!sym){alert('נא להזין סמל');return}
  if(!e||e<=0){alert('נא להזין מחיר כניסה');return}
  if(!s||s<=0){alert('נא להזין סטופ לוס');return}
  if(!sh||sh<=0){alert('נא להזין כמות מניות');return}
  const b=getBal(S.activeId);
  const ra=calcRisk(e,s,sh);const rp=b>0?(ra/b)*100:0;
  const rv=l?calcRR(e,s,l):null;
  S.trades.push({id:uid(),aid:S.activeId,symbol:sym,dir:d,ep:e,sp:s,
    lp:l||null,shares:sh,inv,status:'open',od:dt,ra,rp,rr:rv,notes:nt});
  save();closeM();render();
}

// CLOSE TRADE MODAL
function openClose(id){
  const t=S.trades.find(x=>x.id===id);if(!t)return;
  const a=S.accounts.find(x=>x.id===S.activeId);const c=a?.currency||'₪';
  document.getElementById('mc').innerHTML=`
    <div class="mo" onclick="if(event.target===this)closeM()">
      <div class="md" style="max-width:380px">
        <div class="mh"><span class="mt2">🔒 סגירת עסקה — ${esc(t.symbol)}</span>
          <button class="bic" onclick="closeM()">✕</button></div>
        <div class="mb2">
          <div style="background:var(--bg2);border-radius:10px;padding:10px;margin-bottom:14px;font-size:12px">
            <div class="cr"><span style="color:var(--text2)">כיוון:</span><strong>${t.dir==='long'?'Long ▲':'Short ▼'}</strong></div>
            <div class="cr"><span style="color:var(--text2)">כניסה:</span><strong>${fn(t.ep)}</strong></div>
            <div class="cr"><span style="color:var(--text2)">סטופ:</span><strong>${fn(t.sp)}</strong></div>
            ${t.lp?`<div class="cr"><span style="color:var(--text2)">יעד:</span><strong>${fn(t.lp)}</strong></div>`:''}
            <div class="cr"><span style="color:var(--text2)">כמות:</span><strong>${t.shares}</strong></div>
          </div>
          <div class="fg"><label class="fl">מחיר יציאה</label>
            <input class="fi" id="cx2" type="number" step="0.01" placeholder="0.00" oninput="prevClose('${id}')"></div>
          <div id="cprev4"></div>
          <div class="fg"><label class="fl">תאריך סגירה</label>
            <input class="fi" id="cdt2" type="date" value="${today()}"></div>
        </div>
        <div class="mf">
          <button class="btn bp" onclick="submitClose('${id}')">סגור עסקה</button>
          <button class="btn bs" onclick="closeM()">ביטול</button>
        </div>
      </div>
    </div>`;
}

function prevClose(id){
  const t=S.trades.find(x=>x.id===id);if(!t)return;
  const ex=+document.getElementById('cx2')?.value||0;
  const a=S.accounts.find(x=>x.id===S.activeId);const c=a?.currency||'₪';
  if(!ex){document.getElementById('cprev4').innerHTML='';return}
  const p=calcPnL(t.dir,t.ep,ex,t.shares);
  const pp=(p/t.inv)*100;const col=p>=0?'var(--green)':'var(--red)';
  document.getElementById('cprev4').innerHTML=`
    <div class="cd2" style="border-color:${col};background:${p>=0?'var(--gbg)':'var(--rbg)'}">
      <div class="cr"><span>רווח/הפסד:</span><strong style="color:${col};font-size:15px">${p>=0?'+':''}${c} ${fn(p)}</strong></div>
      <div class="cr"><span>אחוז:</span><strong style="color:${col}">${pp>=0?'+':''}${fn(pp,2)}%</strong></div>
    </div>`;
}

function submitClose(id){
  const ex=+document.getElementById('cx2')?.value||0;
  const cd=document.getElementById('cdt2')?.value||today();
  if(!ex||ex<=0){alert('נא להזין מחיר יציאה');return}
  const t=S.trades.find(x=>x.id===id);if(!t)return;
  const p=calcPnL(t.dir,t.ep,ex,t.shares);const pp=(p/t.inv)*100;
  Object.assign(t,{status:'closed',xp:ex,cd,pnl:p,pp});
  save();closeM();render();
}

function delTrade(id){
  if(!confirm('למחוק עסקה זו?'))return;
  S.trades=S.trades.filter(t=>t.id!==id);save();render();
}

// ACCOUNT MODAL
function openAddAcc(){
  document.getElementById('mc').innerHTML=`
    <div class="mo" onclick="if(event.target===this)closeM()">
      <div class="md" style="max-width:360px">
        <div class="mh"><span class="mt2">🏦 חשבון חדש</span>
          <button class="bic" onclick="closeM()">✕</button></div>
        <div class="mb2">
          <div class="fg"><label class="fl">שם החשבון</label>
            <input class="fi" id="an2" placeholder="לדוגמה: תיק IRA"></div>
          <div class="fg"><label class="fl">יתרה התחלתית</label>
            <input class="fi" id="ab3" type="number" step="100" placeholder="0"></div>
          <div class="fg"><label class="fl">מטבע</label>
            <select class="fi" id="ac2">
              <option value="₪">₪ שקל</option>
              <option value="$">$ דולר</option>
              <option value="€">€ יורו</option>
            </select></div>
        </div>
        <div class="mf">
          <button class="btn bp" onclick="submitAcc()">הוסף</button>
          <button class="btn bs" onclick="closeM()">ביטול</button>
        </div>
      </div>
    </div>`;
}

function submitAcc(){
  const n=(document.getElementById('an2')?.value||'').trim();
  const b=+document.getElementById('ab3')?.value||0;
  const curr=document.getElementById('ac2')?.value||'₪';
  if(!n){alert('נא להזין שם');return}
  if(!b||b<=0){alert('נא להזין יתרה חיובית');return}
  const a={id:uid(),name:n,init:b,currency:curr,created:new Date().toISOString()};
  S.accounts.push(a);S.activeId=a.id;save();closeM();render();
}

function delAcc(id){
  if(S.accounts.length===1){alert('לא ניתן למחוק את החשבון האחרון');return}
  if(!confirm('מחיקת חשבון תמחק גם את כל העסקאות שלו. להמשיך?'))return;
  S.accounts=S.accounts.filter(a=>a.id!==id);
  S.trades=S.trades.filter(t=>t.aid!==id);
  if(S.activeId===id)S.activeId=S.accounts[0]?.id||null;
  save();render();
}

function closeM(){document.getElementById('mc').innerHTML=''}

// ROUTING
function go(p){S.page=p;render()}
function switchAcc(id){S.activeId=id;save();render()}
function toggleDark(){S.dark=!S.dark;document.documentElement.dataset.dark=S.dark;save();render()}

// RENDER
function render(){
  document.documentElement.dataset.dark=S.dark;
  renderSB();renderHDR();
  switch(S.page){
    case'dashboard':renderDash();break;
    case'trades':renderTrades();break;
    case'analytics':renderAnalytics();break;
    case'settings':renderSettings();break;
  }
}

// INIT
load();render();
window.addEventListener('resize',()=>{
  if(S.page==='dashboard'){const cv=getCurve(S.activeId);if(cv.length>=2)drawChart('ch1',cv)}
  if(S.page==='analytics'){const cv=getCurve(S.activeId);if(cv.length>=2)drawChart('ch2',cv)}
});
</script>
</body>
</html>
