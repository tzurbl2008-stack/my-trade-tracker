<!DOCTYPE html>
<html lang="he" dir="rtl" data-dark="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="יומן מסחר">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>יומן מסחר</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8;--bg2:#e2e8f0;--card:#fff;
  --text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --border:#e2e8f0;--primary:#3b82f6;--primary-h:#2563eb;
  --green:#16a34a;--gbg:rgba(22,163,74,.1);
  --red:#dc2626;--rbg:rgba(220,38,38,.1);
  --orange:#ea580c;--obg:rgba(234,88,12,.1);
  --yellow:#ca8a04;--ybg:rgba(202,138,4,.1);
  --sw:230px;--hh:56px;--bnav:60px;--r:14px;
  --sh:0 1px 4px rgba(0,0,0,.07);--shm:0 4px 16px rgba(0,0,0,.1)
}
[data-dark=true]{
  --bg:#0a0f1e;--bg2:#111827;--card:#1a2235;
  --text:#f1f5f9;--text2:#8b9ab0;--text3:#4b5e75;
  --border:#1e2d45;--sh:0 1px 4px rgba(0,0,0,.4);--shm:0 4px 16px rgba(0,0,0,.5)
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;direction:rtl;transition:background .25s,color .25s}

/* ── SIDEBAR desktop ── */
#sb{width:var(--sw);background:#0f172a;height:100vh;position:fixed;right:0;top:0;display:flex;flex-direction:column;z-index:100;border-left:1px solid rgba(255,255,255,.05)}
[data-dark=true] #sb{background:#060d1a}
.sb-logo{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:11px}
.sb-icon{width:38px;height:38px;background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.sb-title{color:#f1f5f9;font-size:15px;font-weight:700;letter-spacing:-.2px}
.sb-sub{color:#4b6280;font-size:10px;margin-top:1px}
#snav{padding:10px 8px;flex:1}
.ni{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#64748b;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;margin-bottom:2px;user-select:none}
.ni:hover{background:rgba(255,255,255,.06);color:#cbd5e1}
.ni.on{background:rgba(59,130,246,.18);color:#60a5fa}
.ni .ic{font-size:16px;flex-shrink:0}
.sb-acc{padding:10px 8px;border-top:1px solid rgba(255,255,255,.07)}
.sb-acc select{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:9px;padding:9px 11px;color:#cbd5e1;font-size:12px;cursor:pointer;outline:none;font-family:inherit}
.sb-acc select option{background:#1e293b}

/* ── MAIN ── */
#main{margin-right:var(--sw);flex:1;display:flex;flex-direction:column;min-height:100vh}
#hdr{height:var(--hh);background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:50;box-shadow:var(--sh)}
.hdr-title{font-size:17px;font-weight:700;flex:1;letter-spacing:-.3px}
.hdr-acc{display:flex;flex-direction:column;align-items:flex-end;background:var(--bg2);padding:5px 12px;border-radius:9px;border:1px solid var(--border)}
.hdr-acc-lbl{font-size:10px;color:var(--text2);font-weight:500}
.hdr-acc-val{font-size:15px;font-weight:700;color:var(--primary)}
.bic{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s}
.bic:hover{background:var(--bg2);color:var(--text)}
#cnt{padding:20px;flex:1;max-width:100%}

/* ── BOTTOM NAV mobile ── */
#bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(0,0,0,.08)}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 0;cursor:pointer;color:var(--text3);transition:color .15s;user-select:none;-webkit-tap-highlight-color:transparent}
.bni.on{color:var(--primary)}
.bni-ic{font-size:22px;line-height:1}
.bni-lbl{font-size:10px;font-weight:600}

/* ── FAB ── */
.fab{position:fixed;left:18px;z-index:99;width:54px;height:54px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 18px rgba(59,130,246,.55);display:none;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.fab:active{transform:scale(.91);box-shadow:0 2px 8px rgba(59,130,246,.4)}

/* ── CARDS & STATS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.ch{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.ct{font-size:14px;font-weight:600}
.cb{padding:16px 18px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.sl{font-size:11px;color:var(--text2);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.sv{font-size:22px;font-weight:700;line-height:1.2}
.ss{font-size:11px;color:var(--text3);margin-top:3px}
.sc.g .sv{color:var(--green)}.sc.r .sv{color:var(--red)}.sc.b .sv{color:var(--primary)}

/* ── HERO CARD mobile ── */
.hero{background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 60%,#3b82f6 100%);border-radius:18px;padding:22px 20px 18px;margin-bottom:14px;color:#fff;box-shadow:0 6px 24px rgba(37,99,235,.35)}
.hero-lbl{font-size:12px;opacity:.75;font-weight:500;margin-bottom:3px}
.hero-val{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.hero-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.hero-stat{text-align:center}
.hero-stat-v{font-size:16px;font-weight:700}
.hero-stat-l{font-size:10px;opacity:.7;margin-top:1px}
.hero-divider{width:1px;height:32px;background:rgba(255,255,255,.2)}

/* ── TRADE CARDS mobile ── */
.tc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;overflow:hidden;transition:box-shadow .15s}
.tc-head{display:flex;align-items:center;padding:13px 15px;gap:10px}
.tc-sym{font-weight:800;font-size:17px;flex:1;letter-spacing:-.3px}
.tc-pnl{font-weight:700;font-size:16px;text-align:left}
.tc-body{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;padding:0 15px 13px}
.tc-kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)}
.tc-kv:last-child{border-bottom:none}
.tc-k{color:var(--text2)}
.tc-v{font-weight:600;color:var(--text)}
.tc-actions{display:flex;gap:8px;padding:10px 15px;border-top:1px solid var(--border);background:var(--bg)}
.tc-analysis{padding:12px 15px;background:var(--bg2);border-top:1px solid var(--border);font-size:12px}
.tc-score-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px}
.tc-score-fill{height:100%;border-radius:3px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:inherit;-webkit-tap-highlight-color:transparent}
.bp{background:var(--primary);color:#fff}.bp:hover{background:var(--primary-h)}
.bs{background:var(--bg2);color:var(--text);border:1px solid var(--border)}.bs:hover{background:var(--border)}
.bd{background:var(--rbg);color:var(--red);border:1px solid rgba(220,38,38,.15)}.bd:hover{background:rgba(220,38,38,.18)}
.bg2{background:var(--gbg);color:var(--green);border:1px solid rgba(22,163,74,.2)}.bg2:hover{background:rgba(22,163,74,.2)}
.sm{padding:5px 11px;font-size:11px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}
.bg3{background:var(--gbg);color:var(--green)}
.br{background:var(--rbg);color:var(--red)}
.bo{background:var(--obg);color:var(--orange)}
.by{background:var(--ybg);color:var(--yellow)}
.bb{background:rgba(59,130,246,.12);color:var(--primary)}
.bgr{background:var(--bg2);color:var(--text2)}

/* ── TABLE desktop ── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:9px 10px;text-align:right;font-weight:600;color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:.05em;background:var(--bg2);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg2)}
tbody td{padding:10px;vertical-align:middle}
.tsym{font-weight:700;font-size:13px}
.ac2{background:var(--bg2);border-radius:10px;padding:12px;margin-top:6px;font-size:12px}
.as3{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.si{padding:5px 8px;background:var(--card);border-radius:6px;margin-bottom:3px;font-size:11px;line-height:1.5}

/* ── CHART ── */
.cc{position:relative;width:100%;height:200px}
canvas{display:block}

/* ── MODAL ── */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.md{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:540px;max-height:93vh;overflow-y:auto;box-shadow:0 -6px 32px rgba(0,0,0,.25)}
.mh{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mh::before{content:'';display:block;width:36px;height:4px;background:var(--border);border-radius:2px;position:absolute;top:10px;left:50%;transform:translateX(-50%)}
.mt2{font-size:17px;font-weight:700}
.mb2{padding:20px 22px}
.mf{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.mf .btn{flex:1;justify-content:center;padding:13px}

/* ── FORM ── */
.fg{margin-bottom:14px}
.fl{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px}
.fi{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:14px;font-family:inherit;transition:border-color .15s;outline:none}
.fi:focus{border-color:var(--primary)}
.fi[type=number]{direction:ltr;text-align:right}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dt{display:flex;border:1.5px solid var(--border);border-radius:10px;overflow:hidden}
.dt button{flex:1;padding:11px 8px;border:none;background:transparent;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.dt button.al{background:var(--gbg);color:var(--green)}
.dt button.as{background:var(--rbg);color:var(--red)}
.fh{font-size:10px;color:var(--text3);margin-top:4px}

/* ── MISC ── */
.tabs{display:flex;gap:3px;background:var(--bg2);padding:3px;border-radius:11px;margin-bottom:14px}
.tab{flex:1;padding:8px 10px;border-radius:8px;border:none;background:transparent;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.tab.on{background:var(--card);color:var(--text);box-shadow:var(--sh);font-weight:700}
.es{text-align:center;padding:52px 20px;color:var(--text2)}
.ei{font-size:42px;margin-bottom:10px}
.et{font-size:15px;font-weight:700;margin-bottom:5px}
.esb{font-size:13px;color:var(--text3)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cd2{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 13px;font-size:12px;color:var(--text2);margin-top:10px}
.cr{display:flex;justify-content:space-between;padding:3px 0}
.cr strong{color:var(--text)}
.sb2{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:3px}
.sf{height:100%;border-radius:3px}
.ai2{display:flex;align-items:center;gap:10px;padding:13px 15px;background:var(--bg2);border-radius:12px;border:1px solid var(--border);margin-bottom:8px}
.an2{font-weight:700;font-size:13px}
.ab2{font-size:11px;color:var(--text2);margin-top:2px}
.dot{width:9px;height:9px;background:var(--green);border-radius:50%}
select.fs{padding:7px 11px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);font-size:12px;font-family:inherit;cursor:pointer;outline:none}
.tg{display:flex;flex-direction:column;gap:8px}
.ti{padding:11px 14px;background:var(--bg2);border-radius:11px;border-right:3px solid var(--primary);font-size:12px;line-height:1.6}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.card,.sc,#hdr,#sb,.tc{transition:background .2s,border-color .2s,box-shadow .2s}
.section-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;margin-top:4px}

/* ── MOBILE OVERRIDES ── */
@media(max-width:768px){
  :root{--sw:0px}
  #sb{display:none}
  #main{margin-right:0;padding-bottom:calc(var(--bnav) + env(safe-area-inset-bottom))}
  #bnav{display:flex}
  .fab{display:flex;bottom:calc(var(--bnav) + env(safe-area-inset-bottom) + 14px)}
  #cnt{padding:14px 14px 8px}
  .sg{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .sv{font-size:19px}
  .desk-only{display:none!important}
  .mo{align-items:flex-end}
}
@media(min-width:769px){
  .mob-only{display:none!important}
  .fab{display:none!important}
  #bnav{display:none!important}
  .mo{align-items:center;padding:16px}
  .md{border-radius:18px;max-width:480px}
}
</style>
</head>
<body>

<!-- SIDEBAR desktop -->
<div id="sb">
  <div class="sb-logo">
    <div class="sb-icon">📈</div>
    <div><div class="sb-title">יומן מסחר</div><div class="sb-sub">TradeTracker Pro</div></div>
  </div>
  <nav id="snav"></nav>
  <div class="sb-acc"><select id="acc-sel" onchange="switchAcc(this.value)"></select></div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="hdr"></div>
  <div id="cnt"></div>
</div>

<!-- BOTTOM NAV mobile -->
<div id="bnav"></div>

<!-- FAB mobile -->
<button class="fab" onclick="openAdd()" title="עסקה חדשה">+</button>

<!-- MODALS -->
<div id="mc"></div>

<script>
// ── STATE ──
let S={accounts:[],activeId:null,trades:[],dark:false,page:'dashboard',tf:'all',df:'all'};

// ── STORAGE ──
function load(){
  try{const d=localStorage.getItem('tt3');if(d)Object.assign(S,JSON.parse(d))}catch(e){}
}
function save(){
  localStorage.setItem('tt3',JSON.stringify({accounts:S.accounts,activeId:S.activeId,trades:S.trades,dark:S.dark}));
}

// ── UTILS ──
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().slice(0,10)}
function fn(n,d=2){return n==null?'-':Number(n).toLocaleString('he-IL',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fd(s){if(!s)return '-';return new Date(s+'T12:00:00').toLocaleDateString('he-IL')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function mob(){return window.innerWidth<=768}

// ── CALC ──
function calcPnL(dir,entry,exit,shares){return dir==='long'?(exit-entry)*shares:(entry-exit)*shares}
function calcRisk(entry,stop,shares){return Math.abs(entry-stop)*shares}
function calcRR(entry,stop,limit){
  if(!limit||!stop||!entry)return null;
  const r=Math.abs(entry-stop);return r?Math.abs(limit-entry)/r:null;
}
function rlevel(pct){
  if(pct<1)return{label:'נמוך',cls:'bg3'};
  if(pct<2)return{label:'בינוני',cls:'by'};
  if(pct<5)return{label:'גבוה',cls:'bo'};
  return{label:'גבוה מאוד',cls:'br'};
}
function getBal(aid){
  const a=S.accounts.find(x=>x.id===aid);if(!a)return 0;
  return a.init+S.trades.filter(t=>t.aid===aid&&t.status==='closed').reduce((s,t)=>s+(t.pnl||0),0);
}
function getCurve(aid){
  const a=S.accounts.find(x=>x.id===aid);if(!a)return[];
  const closed=[...S.trades.filter(t=>t.aid===aid&&t.status==='closed')].sort((a,b)=>a.cd>b.cd?1:-1);
  const pts=[{date:a.created.slice(0,10),balance:a.init}];
  let b=a.init;
  for(const t of closed){b+=t.pnl||0;pts.push({date:t.cd,balance:b})}
  return pts;
}
function getStats(aid){
  const closed=S.trades.filter(t=>t.aid===aid&&t.status==='closed');
  const open=S.trades.filter(t=>t.aid===aid&&t.status==='open');
  const wins=closed.filter(t=>t.pnl>0);
  const losses=closed.filter(t=>t.pnl<=0);
  const tot=closed.reduce((s,t)=>s+(t.pnl||0),0);
  const wr=closed.length?(wins.length/closed.length)*100:0;
  const rrs=closed.filter(t=>t.rr);
  const avgRR=rrs.length?rrs.reduce((s,t)=>s+t.rr,0)/rrs.length:0;
  const b=getBal(aid);const a=S.accounts.find(x=>x.id===aid);
  return{closed,open,wins,losses,tot,wr,avgRR,
    best:closed.length?Math.max(...closed.map(t=>t.pnl||0)):0,
    worst:closed.length?Math.min(...closed.map(t=>t.pnl||0)):0,
    b,pct:a?(tot/a.init)*100:0};
}
function tradeScore(t){
  let s=50;const rp=t.rp||0,rv=t.rr||0;
  if(rp<1)s+=20;else if(rp<2)s+=10;else if(rp>5)s-=20;else if(rp>3)s-=10;
  if(rv>=3)s+=20;else if(rv>=2)s+=10;else if(rv>0&&rv<1)s-=20;else if(rv>0&&rv<1.5)s-=10;
  if(t.pnl>0)s+=10;else if(t.pnl<0)s-=5;
  return Math.max(0,Math.min(100,s));
}
function getSugg(t){
  const s=[];
  if(t.rp>5)s.push('⚠️ סיכון גבוה מאוד — שאוף ל-2% מקסימום לעסקה.');
  else if(t.rp>2)s.push('📊 סיכון מעל 2% — שקול להקטין גודל פוזיציה.');
  if(t.rr&&t.rr<1)s.push('🎯 R/R מתחת ל-1 — שפר יעד רווח או קרב סטופ.');
  if(t.pnl<0)s.push('📉 עסקה הפסדית — בדוק אם ניתוח הכניסה היה תקין.');
  else if(t.pnl>0)s.push('✅ עסקה רווחית — שמור את האסטרטגיה הזו.');
  if(!s.length)s.push('👍 ניהול עסקה תקין. המשך כך!');
  return s;
}
function getTips(aid){
  const closed=S.trades.filter(t=>t.aid===aid&&t.status==='closed');
  if(!closed.length)return[
    'ברוך הבא! הוסף עסקאות כדי לקבל טיפים אישיים.',
    'תמיד קבע סטופ לוס לפני כניסה לכל עסקה.',
    'אל תסכן יותר מ-2% מהתיק בעסקה אחת.',
    'תעד כל עסקה — יומן מסחר הוא כלי השיפור הטוב ביותר.'
  ];
  const wr=closed.length?(closed.filter(t=>t.pnl>0).length/closed.length)*100:0;
  const ar=closed.filter(t=>t.rp).reduce((s,t)=>s+t.rp,0)/(closed.filter(t=>t.rp).length||1);
  const rrs=closed.filter(t=>t.rr);const avgR=rrs.length?rrs.reduce((s,t)=>s+t.rr,0)/rrs.length:0;
  const res=[];
  if(wr<40)res.push(`📊 אחוז הצלחה ${fn(wr,1)}% — שפר נקודות כניסה וחכה לסטאפ ברור.`);
  else if(wr>65)res.push(`🏆 אחוז הצלחה מעולה ${fn(wr,1)}%! שמור על הדיסציפלינה.`);
  else res.push(`👍 אחוז הצלחה סביר ${fn(wr,1)}%. שאוף ל-50%+ עם R/R גבוה.`);
  if(ar>3)res.push(`⚠️ סיכון ממוצע גבוה (${fn(ar,1)}%). הורד ל-1–2% לעסקה.`);
  else if(ar>0)res.push(`✅ ניהול סיכון סביר — ממוצע ${fn(ar,1)}%. שמור על זה.`);
  if(avgR>0&&avgR<1.5)res.push(`🎯 R/R ממוצע ${fn(avgR,2)} — שאוף ל-2:1.`);
  else if(avgR>=2)res.push(`🚀 R/R ממוצע מצוין ${fn(avgR,2)}! המספרים בצדך.`);
  res.push('📅 בדוק ביצועים לפי ימי שבוע — ייתכן שיש ימים עדיפים.');
  res.push('🧘 שמור על קור רוח. אחרי הפסד, עצור לפחות 30 דקות.');
  return res.slice(0,5);
}

// ── CHART ──
function drawChart(id,data){
  requestAnimationFrame(()=>{
    const cv=document.getElementById(id);if(!cv||data.length<2)return;
    const dpr=window.devicePixelRatio||1;
    const rect=cv.parentElement.getBoundingClientRect();
    cv.width=rect.width*dpr;cv.height=rect.height*dpr;
    cv.style.width=rect.width+'px';cv.style.height=rect.height+'px';
    const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    const W=rect.width,H=rect.height;
    const p={t:14,r:12,b:28,l:62};
    const pw=W-p.l-p.r,ph=H-p.t-p.b;
    const bals=data.map(d=>d.balance);
    const mn=Math.min(...bals),mx=Math.max(...bals);const rng=mx-mn||1;
    const dk=document.documentElement.dataset.dark==='true';
    const tc=dk?'#4b5e75':'#94a3b8';const gc=dk?'#1a2235':'#f1f5f9';
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<=4;i++){
      const y=p.t+(i/4)*ph;
      ctx.strokeStyle=gc;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(p.l+pw,y);ctx.stroke();
      ctx.fillStyle=tc;ctx.font='10px system-ui';ctx.textAlign='right';
      ctx.fillText(fn(mx-(i/4)*rng,0),p.l-5,y+4);
    }
    const xs=i=>p.l+(i/(data.length-1))*pw;
    const ys=v=>p.t+ph-((v-mn)/rng)*ph;
    const isUp=data[data.length-1].balance>=data[0].balance;
    const lineColor=isUp?'#22c55e':'#ef4444';
    const gr=ctx.createLinearGradient(0,p.t,0,p.t+ph);
    gr.addColorStop(0,isUp?'rgba(34,197,94,.2)':'rgba(239,68,68,.2)');
    gr.addColorStop(1,isUp?'rgba(34,197,94,0)':'rgba(239,68,68,0)');
    ctx.beginPath();ctx.moveTo(xs(0),ys(data[0].balance));
    for(let i=1;i<data.length;i++)ctx.lineTo(xs(i),ys(data[i].balance));
    ctx.lineTo(xs(data.length-1),p.t+ph);ctx.lineTo(xs(0),p.t+ph);
    ctx.closePath();ctx.fillStyle=gr;ctx.fill();
    ctx.beginPath();ctx.moveTo(xs(0),ys(data[0].balance));
    for(let i=1;i<data.length;i++)ctx.lineTo(xs(i),ys(data[i].balance));
    ctx.strokeStyle=lineColor;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
    for(let i=0;i<data.length;i++){
      ctx.beginPath();ctx.arc(xs(i),ys(data[i].balance),3.5,0,Math.PI*2);
      ctx.fillStyle=lineColor;ctx.fill();
      ctx.strokeStyle=dk?'#1a2235':'#fff';ctx.lineWidth=2;ctx.stroke();
    }
    ctx.fillStyle=tc;ctx.font='10px system-ui';ctx.textAlign='center';
    const st=Math.max(1,Math.floor(data.length/5));
    for(let i=0;i<data.length;i+=st)ctx.fillText(data[i].date.slice(5),xs(i),H-6);
  });
}

// ── ANALYTICS ──
function renderAnalytics(){
  const closed=S.trades.filter(t=>t.aid===S.activeId&&t.status==='closed');
  const a=S.accounts.find(x=>x.id===S.activeId);const c=a?.currency||'₪';
  if(!closed.length){
    document.getElementById('cnt').innerHTML='<div class="es"><div class="ei">📈</div><div class="et">אין מספיק נתונים</div><div class="esb">סגור עסקאות כדי לראות ניתוח</div></div>';
    return;
  }
  const wins=closed.filter(t=>t.pnl>0);const losses=closed.filter(t=>t.pnl<=0);
  const tot=closed.reduce((s,t)=>s+(t.pnl||0),0);
  const aw=wins.length?wins.reduce((s,t)=>s+(t.pnl||0),0)/wins.length:0;
  const al=losses.length?losses.reduce((s,t)=>s+(t.pnl||0),0)/losses.length:0;
  const ar=closed.filter(t=>t.rp).reduce((s,t)=>s+t.rp,0)/(closed.filter(t=>t.rp).length||1);
  const wt=Math.abs(losses.reduce((s,t)=>s+(t.pnl||0),0));
  const pf=wt>0?Math.abs(wins.reduce((s,t)=>s+(t.pnl||0),0))/wt:wins.length?99:0;
  const cv=getCurve(S.activeId);
  const monthly={};
  closed.forEach(t=>{const m=(t.cd||'').slice(0,7);if(!m)return;if(!monthly[m])monthly[m]={pnl:0,cnt:0};monthly[m].pnl+=t.pnl||0;monthly[m].cnt++});
  const rrs=closed.filter(t=>t.rr);const avgRR=rrs.length?rrs.reduce((s,t)=>s+t.rr,0)/rrs.length:0;
  document.getElementById('cnt').innerHTML=`
    <div class="sg" style="margin-bottom:14px">
      <div class="sc"><div class="sl">פקטור רווח</div>
        <div class="sv" style="color:${pf>=1?'var(--green)':'var(--red)'}">${isFinite(pf)&&pf<99?fn(pf,2):'∞'}</div>
        <div class="ss">רווח/הפסד יחס</div></div>
      <div class="sc g"><div class="sl">ממוצע ניצחון</div><div class="sv">${c} ${fn(aw)}</div></div>
      <div class="sc r"><div class="sl">ממוצע הפסד</div><div class="sv">${c} ${fn(Math.abs(al))}</div></div>
      <div class="sc"><div class="sl">סיכון ממוצע</div><div class="sv">${fn(ar,2)}%</div></div>
    </div>

    <!-- Equity curve -->
    <div class="card" style="margin-bottom:14px">
      <div class="ch"><span class="ct">📈 עקומת הון</span></div>
      <div class="cb" style="padding:14px"><div class="cc"><canvas id="ch2"></canvas></div></div>
    </div>

    <!-- Breakdown -->
    <div class="card" style="margin-bottom:14px">
      <div class="ch"><span class="ct">📊 פירוט כללי</span></div>
      <div class="cb">
        ${[['עסקאות מנצחות',`${wins.length} (${fn((wins.length/closed.length)*100,1)}%)`],
           ['עסקאות מפסידות',`${losses.length} (${fn((losses.length/closed.length)*100,1)}%)`],
           ['רווח כולל',`${c} ${fn(tot)}`],
           ['עסקה טובה ביותר',`+${c} ${fn(Math.max(...closed.map(t=>t.pnl||0)))}`],
           ['עסקה גרועה ביותר',`${c} ${fn(Math.min(...closed.map(t=>t.pnl||0)))}`],
           ['R/R ממוצע',avgRR?fn(avgRR,2):'—'],
        ].map(([l,v])=>`<div class="ar" style="padding:9px 2px"><span style="color:var(--text2)">${l}</span><span style="font-weight:700">${v}</span></div>`).join('')}
      </div>
    </div>

    <!-- Monthly -->
    <div class="card" style="margin-bottom:14px">
      <div class="ch"><span class="ct">📅 ביצועים חודשיים</span></div>
      <div class="cb"><div style="display:flex;gap:8px;flex-wrap:wrap">
        ${Object.entries(monthly).sort().map(([m,d])=>`
          <div style="background:${d.pnl>=0?'var(--gbg)':'var(--rbg)'};border-radius:12px;padding:12px 14px;min-width:100px;text-align:center;border:1px solid ${d.pnl>=0?'rgba(22,163,74,.2)':'rgba(220,38,38,.2)'}">
            <div style="font-size:10px;color:var(--text2);margin-bottom:3px;font-weight:600">${m}</div>
            <div style="font-weight:800;font-size:15px;color:${d.pnl>=0?'var(--green)':'var(--red)'}">${d.pnl>=0?'+':''}${c} ${fn(d.pnl)}</div>
            <div style="font-size:10px;color:var(--text2);margin-top:2px">${d.cnt} עסקאות</div>
          </div>`).join('')}
      </div></div>
    </div>

    <!-- Tips -->
    <div class="card">
      <div class="ch"><span class="ct">💡 המלצות לשיפור</span></div>
      <div class="cb" style="padding:12px 14px"><div class="tg">${getTips(S.activeId).map(t=>`<div class="ti">${esc(t)}</div>`).join('')}</div></div>
    </div>`;
  if(cv.length>=2)drawChart('ch2',cv);
}

function setDir(d){
  document.getElementById('fd3').value=d;
  document.getElementById('bl2').className=d==='long'?'al':'';
  document.getElementById('bs3').className=d==='short'?'as':'';
  calcPrev();
}
function calcPrev(){
  const e=+document.getElementById('fe2')?.value||0;
  const s=+document.getElementById('fst2')?.value||0;
  const l=+document.getElementById('fl3')?.value||0;
  const sh=+document.getElementById('fsh2')?.value||0;
  const a=S.accounts.find(x=>x.id===S.activeId);const c=a?.currency||'₪';
  if(e&&sh){const inv=document.getElementById('finv2');if(inv)inv.value=(e*sh).toFixed(2)}
  const prev=document.getElementById('cprev3');if(!prev)return;
  if(e&&s&&sh){
    const b=getBal(S.activeId);
    const ra=calcRisk(e,s,sh);const rp=b>0?(ra/b)*100:0;
    const rv=l?calcRR(e,s,l):null;const rl=rlevel(rp);
    prev.innerHTML=`<div class="cd2">
      <div class="cr"><span>סיכון בעסקה:</span><strong style="color:var(--red)">${c} ${fn(ra)}</strong></div>
      <div class="cr"><span>סיכון מחשבון:</span><strong><span class="badge ${rl.cls}">${fn(rp,2)}% — ${rl.label}</span></strong></div>
      ${rv?`<div class="cr"><span>יחס R/R:</span><strong style="color:${rv>=2?'var(--green)':rv<1?'var(--red)':'var(--yellow)'}">${fn(rv,2)}</strong></div>`:''}</div>`;
  }else prev.innerHTML='';
}
function submitAdd(){
  const sym=(document.getElementById('fs2')?.value||'').trim().toUpperCase();
  const d=document.getElementById('fd3')?.value||'long';
  const e=+document.getElementById('fe2')?.value||0;
  const s=+document.getElementById('fst2')?.value||0;
  const l=+document.getElementById('fl3')?.value||0;
  const sh=+document.getElementById('fsh2')?.value||0;
  const inv=+document.getElementById('finv2')?.value||e*sh;
  const dt=document.getElementById('fdt2')?.value||today();
  const nt=(document.getElementById('fnt2')?.value||'').trim();
  if(!sym){alert('נא להזין סמל');return}
  if(!e||e<=0){alert('נא להזין מחיר כניסה');return}
  if(!s||s<=0){alert('נא להזין סטופ לוס');return}
  if(!sh||sh<=0){alert('נא להזין כמות מניות');return}
  const b=getBal(S.activeId);
  const ra=calcRisk(e,s,sh);const rp=b>0?(ra/b)*100:0;
  const rv=l?calcRR(e,s,l):null;
  S.trades.push({id:uid(),aid:S.activeId,symbol:sym,dir:d,ep:e,sp:s,
    lp:l||null,shares:sh,inv,status:'open',od:dt,ra,rp,rr:rv,notes:nt});
  save();closeM();render();
}

function render(){
  document.documentElement.dataset.dark=S.dark;
  renderSB();renderBNav();renderHDR();
  switch(S.page){
    case'dashboard':renderDash();break;
    case'trades':renderTrades();break;
    case'analytics':renderAnalytics();break;
    case'settings':renderSettings();break;
  }
}

// ── SERVICE WORKER ──
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
}

// ── INIT ──
load();render();
window.addEventListener('resize',()=>{
  render();
  const cv=getCurve(S.activeId);
  if(cv.length>=2){
    if(S.page==='dashboard')drawChart('ch1',cv);
    if(S.page==='analytics')drawChart('ch2',cv);
  }
});
</script>
</body>
</html>
